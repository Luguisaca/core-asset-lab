name: Pages build validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pages:
    name: Validate Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Validate project-site paths
        shell: bash
        run: |
          test -s dist/index.html
          grep -q '/core-asset-lab/' dist/index.html

      - name: Smoke test under Pages base path
        shell: bash
        run: |
          mkdir -p /tmp/pages-root/core-asset-lab
          cp -R dist/. /tmp/pages-root/core-asset-lab/
          npx --yes serve /tmp/pages-root -l 4173 > /tmp/core-asset-lab-pages.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/core-asset-lab/ -o /tmp/core-asset-lab-pages.html; then
              break
            fi
            sleep 1
          done

          test -s /tmp/core-asset-lab-pages.html
          grep -q 'Core Asset Lab' /tmp/core-asset-lab-pages.html
          grep -q 'type="file"' /tmp/core-asset-lab-pages.html
