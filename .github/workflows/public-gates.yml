name: Public Gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-surface:
    name: public-surface
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Validate distributable surface
        run: python3 scripts/public_surface_gate.py

  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Validate public repository policy
        run: python3 scripts/public_policy_gate.py

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  test-build:
    name: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Smoke test built app
        shell: bash
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/cal.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ -o /tmp/cal.html; then break; fi
            sleep 1
          done
          test -s /tmp/cal.html
          grep -q 'Core Asset Lab' /tmp/cal.html
          grep -q 'type="file"' /tmp/cal.html
